[project]
name = "aitt-symbol-clf"
version = "0.1.0"
description = "Train a Half-Circle grayscale image classifier using pytorch"
authors = [
    { name = "Alexandre Poupeau", email = "contact@alexandrepoupeau.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies= [
    "fastapi>=0.115.12",
    "torch>=2.7.0",
    "torchvision>=0.22.0"
]

[dependency-groups]
dev = [
    "torchmetrics>=1.0.3",
    "matplotlib>=3.10.1",
    "opencv-python>=4.11.0.86",
    "pymupdf>=1.25.3",
    "scikit-learn>=1.6.1",
    "tensorboard>=2.19.0",
    "jupyter>=1.1.1",
    "notebook>=7.3.2",
    "opencv-python (>=4.13.0.90,<5.0.0.0)",
    "pymupdf (>=1.26.7,<2.0.0)"
]

[tool.poetry]
requires-poetry = ">=2.0"
package-mode = false


